<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Per te</title>

<style>

body{
margin:0;
background:#0b0b0b;
color:white;
font-family:Arial, sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
text-align:center;
}

.container{
max-width:500px;
padding:20px;
}

h1{
margin-bottom:20px;
font-size:32px;
}

.lyrics{
margin-top:20px;
font-size:20px;
line-height:1.25;
text-align:center; /* testo centrato */
}

.quote-block{
display:block;
margin:0 auto; /* centrato */
}

.question{
margin-top:18px;
font-size:22px;
font-weight:bold;
color:#1DB954;
animation:pulse 3.5s ease-in-out infinite;
}

@keyframes pulse{

0%{
opacity:0.5;
transform:scale(1);
}

50%{
opacity:1;
transform:scale(1.06);
}

100%{
opacity:0.5;
transform:scale(1);
}

}

</style>
</head>

<body>

<div class="container">

<h1>Per te</h1>

<iframe 
style="border-radius:12px" 
src="https://open.spotify.com/embed/track/2ovEk26S9eFIQJ8l7koWR9?utm_source=generator&theme=0" 
width="100%" 
height="352" 
frameborder="0" 
allowfullscreen
allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
loading="lazy">
</iframe>

<div class="lyrics">

<div class="quote-block">
"È un mondo fatto per due<br>
Come le selle delle moto<br>
Come le stelle se le guardi sola<br>
Non è uguale senza di me"
</div>

<div class="question">
"Vanno via tutti resti con me?"
</div>

</div>

</div>

</body>
</html>
